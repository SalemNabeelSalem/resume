name: Render Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Render Resume
        run: rendercv render Salem_Nabil_Salem_Resume.yaml

      - name: Prepare Files
        run: |
          # Locate and copy the generated PDF to the standardized filename
          pdf_file=$(find rendercv_output -name "*.pdf" | head -n 1)
          if [ -n "$pdf_file" ]; then
            cp "$pdf_file" rendercv_output/Salem_Nabil_Salem_Resume.pdf
          fi

          # Create index.html to redirect root URL traffic directly to the PDF with cache-busting
          cat << 'EOF' > rendercv_output/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8">

              <!-- Prevents browsers and proxies from caching this page -->
              <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />

              <!-- Ensures cache prevention on older HTTP/1.0 browsers -->
              <meta http-equiv="Pragma" content="no-cache" />

              <!-- Forces the cached version to expire immediately -->
              <meta http-equiv="Expires" content="0" />

              <!-- Triggers an immediate meta-refresh redirect to the PDF file -->
              <meta http-equiv="refresh" content="0; url=/Salem_Nabil_Salem_Resume.pdf?v=${{ github.sha }}">

              <script type="text/javascript">
                // Performs a client-side JavaScript redirect without leaving the current page in session history
                window.location.replace("/Salem_Nabil_Salem_Resume.pdf?v=${{ github.sha }}");
              </script>

              <!-- Sets the title shown on the browser tab -->
              <title>Redirecting to Resume...</title>
            </head>
            <body>
              <!-- Fallback text and manual hyperlink shown if automatic redirects fail or are disabled -->
              <p>If you are not redirected automatically, <a href="/Salem_Nabil_Salem_Resume.pdf?v=${{ github.sha }}">click here to view the PDF</a>.</p>
            </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./rendercv_output
          publish_branch: gh-pages
          cname: resume.isalem.dev
          force_orphan: true