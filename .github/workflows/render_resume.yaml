name: Render Resume

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install RenderCV
        run: |
          python -m pip install --upgrade pip
          pip install "rendercv[full]"

      - name: Render Resume
        run: rendercv render Salem_Nabil_Salem_Resume.yaml

      - name: Rename PDF for Release Link
        run: |
          cp rendercv_output/*.pdf rendercv_output/Salem_Nabil_Salem_Resume.pdf

      - name: Release PDF
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Latest Resume PDF"
          files: rendercv_output/Salem_Nabil_Salem_Resume.pdf